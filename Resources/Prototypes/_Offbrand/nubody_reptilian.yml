- type: markingsGroup
  id: Reptilian
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ LizardTailSmooth ]
    enum.HumanoidVisualLayers.Chest:
      limit: 3
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      default: [ LizardSnoutRound ]
    enum.HumanoidVisualLayers.HeadTop:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false

- type: entity
  parent: OFMNuristAppearance
  id: OFMAppearanceReptilian
  components:
  - type: Inventory
    speciesId: reptilian
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Reptilian/displacement.rsi
            state: jumpsuit-female
      head:
        sizeMaps:
          32:
            sprite: Mobs/Species/Reptilian/displacement.rsi
            state: head
      mask:
        sizeMaps:
          32:
            sprite: Mobs/Species/Reptilian/displacement.rsi
            state: mask
    displacements:
      head:
        sizeMaps:
          32:
            sprite: Mobs/Species/Reptilian/displacement.rsi
            state: head
      mask:
        sizeMaps:
          32:
            sprite: Mobs/Species/Reptilian/displacement.rsi
            state: mask
  - type: EntityTableContainerFill
    containers:
      body_organs: !type:AllSelector
        children:
        - id: OFMOrganReptilianTorso
        - id: OFMOrganReptilianHead
        - id: OFMOrganReptilianArmLeft
        - id: OFMOrganReptilianArmRight
        - id: OFMOrganReptilianHandRight
        - id: OFMOrganReptilianHandLeft
        - id: OFMOrganReptilianLegLeft
        - id: OFMOrganReptilianLegRight
        - id: OFMOrganReptilianFootLeft
        - id: OFMOrganReptilianFootRight
        - id: OFMOrganReptilianBrain
        - id: OFMOrganReptilianEyes
        - id: OFMOrganReptilianTongue
        - id: OFMOrganReptilianAppendix
        - id: OFMOrganReptilianEars
        - id: OFMOrganReptilianLungs
        - id: OFMOrganReptilianHeart
        - id: OFMOrganReptilianStomach
        - id: OFMOrganReptilianLiver
        - id: OFMOrganReptilianKidneys

- type: entity
