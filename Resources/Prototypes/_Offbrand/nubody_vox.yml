- type: markingsGroup
  id: Vox
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Head:
      limit: 4
      required: true
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: true
      default: [ VoxBeak ]
    enum.HumanoidVisualLayers.SnoutCover:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: true
      default: [ VoxLArmScales ]
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: true
      default: [ VoxRArmScales ]
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: true
      default: [ VoxLHandScales ]
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: true
      default: [ VoxRHandScales ]
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: true
      default: [ VoxLLegScales ]
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: true
      default: [ VoxRLegScales ]
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: true
      default: [ VoxLFootScales ]
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: true
      default: [ VoxRFootScales ]
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ VoxTail ]

- type: entity
  parent: OFMNuristAppearance
  id: OFMAppearanceVox
  components:
  - type: Inventory
    speciesId: vox
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: jumpsuit
      eyes:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: eyes
      gloves:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: hand
      head:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: head
      neck:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: neck
      back:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: back
      ears:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: ears
      shoes:
        sizeMaps:
          32:
            sprite: Mobs/Species/Vox/displacement.rsi
            state: shoes
  - type: Hands
    leftHandDisplacement:
      sizeMaps:
        32:
          sprite: Mobs/Species/Vox/displacement.rsi
          state: hand_l
    rightHandDisplacement:
      sizeMaps:
        32:
          sprite: Mobs/Species/Vox/displacement.rsi
          state: hand_r
  - type: EntityTableContainerFill
    containers:
      body_organs: !type:AllSelector
        children:
        - id: OFMOrganVoxTorso
        - id: OFMOrganVoxHead
        - id: OFMOrganVoxArmLeft
        - id: OFMOrganVoxArmRight
        - id: OFMOrganVoxHandRight
        - id: OFMOrganVoxHandLeft
        - id: OFMOrganVoxLegLeft
        - id: OFMOrganVoxLegRight
        - id: OFMOrganVoxFootLeft
        - id: OFMOrganVoxFootRight
        - id: OFMOrganVoxBrain
        - id: OFMOrganVoxEyes
        - id: OFMOrganVoxTongue
        - id: OFMOrganVoxAppendix
        - id: OFMOrganVoxEars
        - id: OFMOrganVoxLungs
        - id: OFMOrganVoxHeart
        - id: OFMOrganVoxStomach
        - id: OFMOrganVoxLiver
        - id: OFMOrganVoxKidneys

