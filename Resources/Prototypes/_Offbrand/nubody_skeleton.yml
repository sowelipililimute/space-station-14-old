- type: markingsGroup
  id: Skeleton
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.Snout:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false

- type: entity
  parent: OFMNuristAppearance
  id: OFMAppearanceSkeleton
  components:
  - type: EntityTableContainerFill
    containers:
      body_organs: !type:AllSelector
        children:
        - id: OFMOrganSkeletonTorso
        - id: OFMOrganSkeletonHead
        - id: OFMOrganSkeletonArmLeft
        - id: OFMOrganSkeletonArmRight
        - id: OFMOrganSkeletonHandRight
        - id: OFMOrganSkeletonHandLeft
        - id: OFMOrganSkeletonLegLeft
        - id: OFMOrganSkeletonLegRight
        - id: OFMOrganSkeletonFootLeft
        - id: OFMOrganSkeletonFootRight

- type: entity
  parent:
  - OFMAppearanceSkeleton
  - OFMNuristMob
  id: OFMMobSkeleton

- type: entity
  parent: OFMOrganBase
  id: OFMOrganSkeleton
  abstract: true
  suffix: skeleton

- type: entity
  parent: OFMOrganSkeleton
  id: OFMOrganSkeletonVisual
  abstract: true
  components:
  - type: OFMVisualOrgan
    data:
      sprite: Mobs/Species/Skeleton/parts.rsi
  - type: OFMVisualOrganMarkings
    markingData:
      group: Skeleton

- type: entity
  parent: [ OFMOrganBaseTorso, OFMOrganSkeletonVisual ]
  id: OFMOrganSkeletonTorso

- type: entity
  parent: [ OFMOrganBaseHead, OFMOrganSkeletonVisual ]
  id: OFMOrganSkeletonHead

- type: entity
  parent: [ OFMOrganBaseArmLeft, OFMOrganSkeletonVisual ]
  id: OFMOrganSkeletonArmLeft

- type: entity
  parent: [ OFMOrganBaseArmRight, OFMOrganSkeletonVisual ]
