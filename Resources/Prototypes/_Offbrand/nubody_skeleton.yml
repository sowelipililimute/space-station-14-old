- type: entity
  parent: [ OFMOrganBaseHandLeft, OFMOrganSkeletonVisual ]
  id: OFMOrganSkeletonHandLeft

- type: entity
  parent: [ OFMOrganBaseHandRight, OFMOrganSkeletonVisual ]
  id: OFMOrganSkeletonHandRight

- type: entity
  parent: [ OFMOrganBaseLegLeft, OFMOrganSkeletonVisual ]
  id: OFMOrganSkeletonLegLeft

- type: entity
  parent: [ OFMOrganBaseLegRight, OFMOrganSkeletonVisual ]
  id: OFMOrganSkeletonLegRight

- type: entity
  parent: [ OFMOrganBaseFootLeft, OFMOrganSkeletonVisual ]
  id: OFMOrganSkeletonFootLeft

- type: entity
