- type: markingsGroup
  id: Slime
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RHand:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LFoot:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RFoot:
      limit: 1
      required: false

- type: entity
  parent: OFMNuristAppearance
  id: OFMAppearanceSlime
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: EntityTableContainerFill
    containers:
      body_organs: !type:AllSelector
        children:
        - id: OFMOrganSlimeTorso
        - id: OFMOrganSlimeHead
        - id: OFMOrganSlimeArmLeft
        - id: OFMOrganSlimeArmRight
        - id: OFMOrganSlimeHandRight
        - id: OFMOrganSlimeHandLeft
        - id: OFMOrganSlimeLegLeft
        - id: OFMOrganSlimeLegRight
        - id: OFMOrganSlimeFootLeft
        - id: OFMOrganSlimeFootRight
        - id: OFMOrganSlimeBrain
        - id: OFMOrganSlimeEyes
        - id: OFMOrganSlimeTongue
        - id: OFMOrganSlimeAppendix
        - id: OFMOrganSlimeEars
        - id: OFMOrganSlimeLungs
        - id: OFMOrganSlimeHeart
        - id: OFMOrganSlimeStomach
        - id: OFMOrganSlimeLiver
        - id: OFMOrganSlimeKidneys

- type: entity
  parent:
  - OFMAppearanceSlime
  - OFMNuristMob
  id: OFMMobSlime

- type: entity
  parent: OFMOrganBase
  id: OFMOrganSlime
  abstract: true
  suffix: slime

- type: entity
  parent: OFMOrganSlime
  id: OFMOrganSlimeVisual
  abstract: true
  components:
  - type: OFMVisualOrgan
    data:
      sprite: Mobs/Species/Slime/parts.rsi
  - type: OFMVisualOrganMarkings
    markingData:
      group: Slime

