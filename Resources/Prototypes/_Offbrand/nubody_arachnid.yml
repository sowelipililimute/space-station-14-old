- type: markingsGroup
  id: Arachnid
  onlyGroupWhitelisted: true
  limits:
    enum.HumanoidVisualLayers.Hair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.FacialHair:
      limit: 0
      required: false
    enum.HumanoidVisualLayers.Tail:
      limit: 1
      required: true
      default: [ ArachnidAppendagesDefault ]
    enum.HumanoidVisualLayers.Chest:
      limit: 2
      required: false
    enum.HumanoidVisualLayers.HeadSide:
      limit: 1
      required: true
      default: [ ArachnidCheliceraeDownwards ]
    enum.HumanoidVisualLayers.LArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RArm:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.LLeg:
      limit: 1
      required: false
    enum.HumanoidVisualLayers.RLeg:
      limit: 1
      required: false

- type: entity
  parent: OFMNuristAppearance
  id: OFMAppearanceArachnid
  components:
  - type: Inventory
    templateId: arachnid
    speciesId: arachnid
  - type: EntityTableContainerFill
    containers:
      body_organs: !type:AllSelector
        children:
        - id: OFMOrganArachnidTorso
        - id: OFMOrganArachnidHead
        - id: OFMOrganArachnidArmLeft
        - id: OFMOrganArachnidArmRight
        - id: OFMOrganArachnidHandRight
        - id: OFMOrganArachnidHandLeft
        - id: OFMOrganArachnidLegLeft
        - id: OFMOrganArachnidLegRight
        - id: OFMOrganArachnidFootLeft
        - id: OFMOrganArachnidFootRight
        - id: OFMOrganArachnidBrain
        - id: OFMOrganArachnidEyes
        - id: OFMOrganArachnidTongue
        - id: OFMOrganArachnidAppendix
        - id: OFMOrganArachnidEars
        - id: OFMOrganArachnidLungs
        - id: OFMOrganArachnidHeart
        - id: OFMOrganArachnidStomach
        - id: OFMOrganArachnidLiver
        - id: OFMOrganArachnidKidneys

- type: entity
  parent:
  - OFMAppearanceArachnid
  - OFMNuristMob
  id: OFMMobArachnid

- type: entity
